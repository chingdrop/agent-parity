[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-parity"
version = "1.2.0"
description = "Device coverage reconciliation: correlate an AD computer inventory against EDR agent inventories (SentinelOne, Carbon Black, BitDefender) to find missing, orphaned, and stale agent coverage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "requests>=2.32",
    "certifi>=2024.7.4",
    "urllib3>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "boto3>=1.34",
    "sqlalchemy>=2.0",
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
# The quarterly PDF report (`agent-parity report`). Optional so the scheduled
# path and the CLI's other commands don't carry a PDF stack.
report = ["reportlab>=4.4"]

[project.urls]
Repository = "https://github.com/chingdrop/agent-parity"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[s3]>=5.0",
    "openpyxl>=3.1",
    "pandas-stubs~=3.0.3",
    "boto3-stubs~=1.43.40",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pre-commit>=4.0",
    "pytest-cov>=7.1.0",
    "reportlab>=4.4",
    # Rasterizes the sample report's first page for the README
    # (tools/gen_sample_quarterly_report.py); not used at runtime.
    "pypdfium2>=4.30",
]

[project.scripts]
agent-parity = "agent_parity.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent_parity"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# The coverage floor (line + branch): the measured baseline (94.14% on
# 2026-10-03) minus 2 points, rounded down. Raise it when the baseline
# exceeds the floor by more than 4.
fail_under = 92

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E501",  # long CSV/fixture literals in triple-quoted strings
    "S101",  # pytest assertions are plain `assert`
    "S106",  # dummy credentials ("test", "k", ...) passed to constructors in fixtures
]

[tool.mypy]
python_version = "3.12"
files = ["src/agent_parity"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Stricter than mypy's defaults, and clean today.
check_untyped_defs = true
strict_equality = true
warn_unreachable = true
# Deliberately not `strict = true`: that currently reports 90 errors in 19 files
# (56 bare generics [type-arg], 16 missing annotations [no-untyped-def],
# 7 [no-any-return], 6 [no-untyped-call], 5 untyped Celery decorators
# [untyped-decorator]). Tighten one flag at a time from here.

[[tool.mypy.overrides]]
module = ["celery.*", "reportlab.*", "pypdfium2.*"]
ignore_missing_imports = true
