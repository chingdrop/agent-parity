# Bare-bones local dev/test setup for agent-parity:
#
# * `agent-parity` — builds docker/Dockerfile so the CLI can be run without a
#   local uv install: `docker compose run agent-parity run --csv` (run
#   history lands in the shared SQLite volume below). Runs fully offline against sample_data/ by
#   default (no .env required) — pass `--env-file ../.env` on the command
#   line for live credentials.
# * `s3` — S3-compatible object storage (Versity S3 Gateway over a local
#   directory) for locally exercising the real AD-export handoff path (see
#   agent_parity.storage and docs/decisions/0011).
#   The code targets the S3 API, not this product; production uses AWS S3. Everything else in
#   this package runs directly via `uv run agent-parity` — no other services
#   needed for that path.
# * `redis` / `worker` / `beat` — the scheduled path: `worker` runs Celery
#   tasks (agent_parity/scheduling/tasks.py), `beat` fires `dispatch_all_clients` on
#   the schedule in agent_parity/scheduling/celery_app.py, `redis` is both the broker
#   and result backend. All three, plus the `agent-parity` service's own
#   `run` invocations, share one SQLite file via the `dbdata` volume — SQLite is a
#   file, not a service, so there's nothing else to run for persistence.
#
# This is this package's deployment shape, run here as a local dev/demo
# stack; a production deployment extends it (real AWS S3 instead of the local `s3` service,
# live credentials via --env-file) rather than replacing it.

x-celery-env: &celery-env
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  AGENT_PARITY_DB_URL: sqlite:////app/data/agent_parity.db
  # Shared by the CLI, worker and beat so one daily refresh serves them all.
  AGENT_PARITY_EOL_CACHE: /app/data/os_eol_cache.json

services:
  agent-parity:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      <<: *celery-env
    volumes:
      - ../sample_data:/app/sample_data:ro
      - ../output:/app/output
      - dbdata:/app/data
    depends_on:
      - s3

  s3:
    # Pinned: a floating tag is how the previous server (MinIO) broke this stack
    # when its images were withdrawn.
    image: versity/versitygw:v1.8.0
    command: [ "--port", ":9000", "--health", "/health", "posix", "/data" ]
    environment:
      ROOT_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY:-agent_parity}
      ROOT_SECRET_KEY: ${LOCAL_S3_SECRET_KEY:-agent_parity_s3}
    volumes:
      - s3data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["uv", "run", "--no-sync", "celery", "-A", "agent_parity.scheduling.celery_app", "worker", "--loglevel=info"]
    environment:
      <<: *celery-env
    volumes:
      - ../sample_data:/app/sample_data:ro
      - dbdata:/app/data
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["uv", "run", "--no-sync", "celery", "-A", "agent_parity.scheduling.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *celery-env
    volumes:
      - ../sample_data:/app/sample_data:ro
      - dbdata:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  s3data:
  dbdata:
