[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-parity"
version = "1.2.0"
description = "Device coverage reconciliation: correlate an AD computer inventory against EDR agent inventories (SentinelOne, Carbon Black, BitDefender) to find missing, orphaned, and stale agent coverage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "requests>=2.32",
    "certifi>=2024.7.4",
    "urllib3>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "boto3>=1.34",
    "sqlalchemy>=2.0",
    "celery[redis]>=5.4",
]

[project.urls]
Repository = "https://github.com/chingdrop/agent-parity"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[s3]>=5.0",
    "openpyxl>=3.1",
    "pandas-stubs~=3.0.3",
    "boto3-stubs~=1.43.40",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pre-commit>=4.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
agent-parity = "agent_parity.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent_parity"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E501",  # long CSV/fixture literals in triple-quoted strings
    "S101",  # pytest assertions are plain `assert`
    "S106",  # dummy credentials ("test", "k", ...) passed to constructors in fixtures
]

[tool.mypy]
python_version = "3.12"
files = ["src/agent_parity"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Stricter than mypy's defaults, and clean today.
check_untyped_defs = true
strict_equality = true
warn_unreachable = true
# Deliberately not `strict = true`: that currently reports 80 errors in 19 files
# (41 bare generics [type-arg], 15 missing annotations [no-untyped-def],
# 10 [no-untyped-call], 7 untyped Celery decorators [untyped-decorator],
# 6 [no-any-return], 1 [attr-defined]). Tighten one flag at a time from here.

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
