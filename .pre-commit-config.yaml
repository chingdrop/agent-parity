# Run `uv run pre-commit autoupdate` periodically to move these pinned revs forward,
# then review the diff (and run `uv run pre-commit run --all-files`) before committing.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests|tools|docker)/
      - id: ruff-format
        files: ^(src|tests|tools|docker)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pandas-stubs
          - boto3-stubs
          - types-pyyaml
        files: ^src/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
